[package]
name = "prooflab"
version = "0.1.0"
edition = "2021"
description = "Zero-knowledge proof lab for working with zkVMs"
authors = ["ProofLab Team"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "prooflab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
regex = "1.10.5"
anyhow = "1.0.86"
hex = "0.4.3"
tokio = "1.38.0"
prooflab_io = { path = "../prooflab_io" }
toml = "0.8.12"
reqwest = { version = "0.11", features = ["blocking"] }

# Sp1
sp1-sdk = { git = "https://github.com/succinctlabs/sp1.git", tag = "v4.0.1" }

# Risc 0
risc0-zkvm = { git = "https://github.com/risc0/risc0.git", tag = "v1.2.0" }

# Aligned SDK
aligned-sdk = { git = "https://github.com/yetanotherco/aligned_layer", tag = "v0.10.2" }
ethers = { tag = "v2.0.15-fix-reconnections", features = [
    "ws",
    "rustls",
], git = "https://github.com/yetanotherco/ethers-rs.git" }

dialoguer = "0.11.0"
bincode = "1.3.3"
rpassword = "7.3.1"
env_logger = "0.11.3"
log = "0.4.22"
# std::env::dir is deprecated on windows
dirs = "5.0.0"
serde_json = "1.0"
sysinfo = "0.33.1"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
nvml-wrapper = "0.9.0"
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3.10.1"
assert_fs = "1.1.1"
rand = "0.8.5"
mockall = "0.12.1"